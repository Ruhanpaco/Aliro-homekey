name: matter-probe

# Feasibility probe, not part of the firmware build.
#
# Espressif ship an Aliro-over-NFC door lock, but only with Thread configs for
# the ESP32-C6 and ESP32-H2. This project's board is a plain ESP32: Wi-Fi only,
# no 802.15.4. Nothing in the example gates Aliro on the transport, so the
# combination should build -- the open questions are whether it does, and
# whether the result fits a 4 MB part.
#
# Answering that costs one build. Guessing at it costs a hardware purchase.

on:
  workflow_dispatch:

jobs:
  door-lock-wifi-aliro:
    runs-on: ubuntu-latest
    container:
      image: espressif/esp-matter:latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3]

    steps:
      - name: Build Espressif's door lock with Aliro over Wi-Fi
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"

          cd "$ESP_MATTER_PATH/examples/door_lock"

          # The stock defaults are already Wi-Fi plus BLE for commissioning.
          # Aliro is a separate switch, so this is the untried combination:
          # their Aliro configs turn Wi-Fi off and OpenThread on.
          cat > sdkconfig.probe <<'CFG'
          CONFIG_ENABLE_ALIRO_OVER_NFC=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y

          # The first attempt overflowed IRAM by 5,680 bytes on the ESP32.
          # Flash was never the problem: the classic ESP32 has a hard ~128 KB
          # instruction-RAM window and Wi-Fi and BLE both want to live in it.
          # Everything below either shrinks code or moves it out to flash.
          # Espressif's own Aliro config carries the first three; the Wi-Fi
          # IRAM options are the ones that actually free the space, at the cost
          # of throughput nobody needs on a door lock.
          CONFIG_COMPILER_OPTIMIZATION_SIZE=y
          CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
          CONFIG_COMPILER_SAVE_RESTORE_LIBCALLS=y
          CONFIG_ESP_WIFI_IRAM_OPT=n
          CONFIG_ESP_WIFI_RX_IRAM_OPT=n
          CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y
          CONFIG_SPI_FLASH_ROM_IMPL=y

          # BLE is only used to hand over Wi-Fi credentials at commissioning,
          # so it never needs to scan or act as a client.
          CONFIG_BT_NIMBLE_ROLE_CENTRAL=n
          CONFIG_BT_NIMBLE_ROLE_OBSERVER=n
          CFG

          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.probe" \
                 set-target ${{ matrix.target }} build 2>&1 | tail -40

      - name: Does it fit
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          cd "$ESP_MATTER_PATH/examples/door_lock"
          app=$(ls build/*.bin 2>/dev/null | grep -v bootloader | grep -v partition | head -1)
          if [ -z "$app" ]; then
            echo "no application image was produced -- see the build log above"
            exit 0
          fi

          size=$(stat -c%s "$app")
          echo "application: $app"
          echo "size:        $size bytes ($(( size / 1024 )) KB)"
          echo
          echo "  1.875 MB slot (dual-slot OTA, what we ship today): $(( 1966080 - size )) bytes spare"
          echo "  3.875 MB slot (single slot, OTA dropped):          $(( 4063232 - size )) bytes spare"
          echo
          if [ "$size" -le 1966080 ]; then
            echo "VERDICT: fits with OTA kept."
          elif [ "$size" -le 4063232 ]; then
            echo "VERDICT: fits only if OTA is dropped for a single app partition."
          else
            echo "VERDICT: does not fit a 4 MB part at all."
          fi
