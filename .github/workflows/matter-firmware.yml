name: matter-firmware

# Builds a flashable Matter + Aliro door lock for the ESP32, driving a PN532.
#
# Espressif's esp-matter door_lock example already does Matter commissioning and
# Aliro-over-NFC correctly, so it is the base rather than something to reimplement.
# Two things are changed: its NFC frontend becomes ours (it ships an ST25R3916 on
# an M5Unit-NFC; a PN532 is the part people can buy), and the build targets Wi-Fi
# on a classic ESP32 instead of Thread on a C6/H2.
#
# The output is a factory image to flash at 0x0 and commission with chip-tool.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Chip to build for
        type: choice
        options: [esp32, esp32c3]
        default: esp32

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/esp-matter:latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: aliro

      - name: Swap the ST25R3916 frontend for our PN532
        shell: bash
        run: |
          set -euo pipefail
          example="$ESP_MATTER_PATH/examples/door_lock"

          # Their m5nfc component: find it rather than assume a path, since it
          # may live in the example or be pulled in as a managed component.
          their_nfc=$(find "$ESP_MATTER_PATH" -type d -name m5nfc | head -1)
          if [ -z "$their_nfc" ]; then
            echo "could not find their m5nfc component" >&2
            exit 1
          fi
          echo "replacing $their_nfc"

          # Ours provides the same five functions from the same header, so the
          # example's app_main and the Aliro delegate compile untouched.
          rm -rf "$their_nfc"
          mkdir -p "$example/components/m5nfc" "$example/components/pn532"
          cp "$GITHUB_WORKSPACE/aliro/components/pn532_m5nfc/m5nfc.c" \
             "$GITHUB_WORKSPACE/aliro/components/pn532_m5nfc/m5nfc.h" \
             "$GITHUB_WORKSPACE/aliro/components/pn532_m5nfc/Kconfig" \
             "$GITHUB_WORKSPACE/aliro/components/pn532_m5nfc/CMakeLists.txt" \
             "$example/components/m5nfc/"
          cp -r "$GITHUB_WORKSPACE/aliro/components/pn532/." "$example/components/pn532/"

          # The M5Stack units are only there for the frontend we just removed.
          sed -i '/m5stack__M5Unit-NFC/,+1d' "$example/main/idf_component.yml" || true
          echo "--- example components ---"
          ls "$example/components"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          cd "$ESP_MATTER_PATH/examples/door_lock"

          cat > sdkconfig.pn532 <<'CFG'
          CONFIG_ENABLE_ALIRO_OVER_NFC=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y

          # Measured: without these the ESP32 overflows IRAM by 5,680 bytes.
          CONFIG_COMPILER_OPTIMIZATION_SIZE=y
          CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
          CONFIG_COMPILER_SAVE_RESTORE_LIBCALLS=y
          CONFIG_ESP_WIFI_IRAM_OPT=n
          CONFIG_ESP_WIFI_RX_IRAM_OPT=n
          CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y
          CONFIG_SPI_FLASH_ROM_IMPL=y
          CONFIG_BT_NIMBLE_ROLE_CENTRAL=n
          CONFIG_BT_NIMBLE_ROLE_OBSERVER=n

          # PN532 on SPI, the pins this project has used throughout.
          CONFIG_PN532_BUS_SPI=y
          CONFIG_PN532_SPI_HOST=1
          CONFIG_PN532_SPI_SCK=18
          CONFIG_PN532_SPI_MISO=19
          CONFIG_PN532_SPI_MOSI=23
          CONFIG_PN532_SPI_CS=5
          CONFIG_PN532_SPI_FREQ_HZ=1000000
          CONFIG_PN532_RST_PIN=-1
          CFG

          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.pn532" \
                 set-target ${{ inputs.target }} build 2>&1 | tail -30

      - name: Package a factory image and report the onboarding payload
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd "$ESP_MATTER_PATH/examples/door_lock/build"

          out="$GITHUB_WORKSPACE/firmware"
          mkdir -p "$out"

          # @flash_args carries the offsets the build actually chose, so the
          # merged image cannot drift from the real partition layout.
          python -m esptool --chip ${{ inputs.target }} merge_bin \
              -o "$out/${{ inputs.target }}.matter.factory.bin" -f raw \
              --fill-flash-size 4MB @flash_args
          cp door_lock.bin "$out/${{ inputs.target }}.matter.bin"

          echo "=== sizes ==="
          ls -l "$out"
          echo
          echo "=== commissioning ==="
          echo "These are esp-matter's test credentials, which is what chip-tool expects:"
          echo "  discriminator : 3840"
          echo "  passcode      : 20202021"
          echo "The device prints its own MT: payload and QR URL on boot."

      - uses: actions/upload-artifact@v4
        with:
          name: matter-firmware-${{ inputs.target }}
          path: firmware/
          retention-days: 30
