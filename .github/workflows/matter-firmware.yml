name: matter-firmware

# This firmware, built with the Matter door lock endpoint switched on.
#
# It is the same project as the ordinary build -- same web UI, same setup
# portal, same OTA page, same PN532 reader -- with components/matter_lock
# compiled in instead of stubbed out. The only reason it needs its own workflow
# is the toolchain: esp-matter is a 2 GB checkout with its own submodules, so
# the build runs in Espressif's container rather than the ESP-IDF action.
#
# Output is the same pair of images the normal build produces:
#
#   <target>.matter.firmware.factory.bin  flash at 0x0, wipes the board
#   <target>.matter.firmware.bin          app only, for the OTA page

on:
  workflow_dispatch:
    inputs:
      target:
        description: Chip to build for
        type: choice
        options: [esp32, esp32c3, esp32s3]
        default: esp32

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Keep the current esp-matter APIs while pinning the ESP-IDF generation.
      # The floating `latest` tag moved to IDF 6, which no longer provides the
      # `json` component this firmware depends on.
      image: espressif/esp-matter:latest_idf_v5.5.4

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"

          # ESP_MATTER_PATH is what the top-level CMakeLists keys off to add
          # esp-matter's components; sdkconfig.matter is what turns the door
          # lock endpoint on.
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.matter" \
                 set-target ${{ inputs.target }} build

          # A previous attempt used a nonexistent Kconfig symbol. ESP-IDF only
          # warned and produced firmware without subscription persistence, so
          # verify the generated CHIP build argument rather than trusting that
          # the overlay was accepted.
          grep -Fqx 'chip_persist_subscriptions = true' \
               build/esp-idf/chip/args.gn

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          ./tools/package_firmware.sh ${{ inputs.target }} matter

          # The ELF and the map, because a panic on this build prints raw
          # addresses and nothing else can turn them back into lines. A
          # backtrace you cannot decode costs a whole build cycle to diagnose;
          # these two files cost nothing to carry.
          cp build/aliro_homekey.elf build/aliro_homekey.map firmware/

      - name: Report what has to fit
        shell: bash
        run: |
          set -euo pipefail
          app=$(stat -c%s build/aliro_homekey.bin)
          slot=$((0x1E0000))
          echo "application : $((app / 1024)) KB"
          echo "OTA slot    : $((slot / 1024)) KB"
          echo "headroom    : $(((slot - app) / 1024)) KB"
          if [ "$app" -ge "$slot" ]; then
            echo "::error::the application does not fit an OTA slot"
            exit 1
          fi
          # Under 64 KB spare is not enough room for a firmware update to grow
          # into, and finding that out during an OTA is finding out too late.
          if [ $((slot - app)) -lt 65536 ]; then
            echo "::warning::less than 64 KB of headroom in the OTA slot"
          fi

      - name: Commissioning notes
        shell: bash
        run: |
          echo "This image uses esp-matter's test attestation credentials."
          echo "  discriminator : 3840"
          echo "  passcode      : 20202021"
          echo "chip-tool and Home Assistant accept those, and Apple Home"
          echo "commissions it after warning that it is uncertified."
          echo "The device prints its own MT: payload and a QR URL on boot, and"
          echo "the web UI shows both on the dashboard."

      - uses: actions/upload-artifact@v4
        with:
          name: matter-firmware-${{ inputs.target }}
          path: firmware/
          retention-days: 30
