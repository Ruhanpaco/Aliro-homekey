name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static consistency checks
        run: ./tools/check_consistency.py



  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
        idf: ["v5.4", "v5.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/sdkconfig.defaults.${{ matrix.target }}" build &&
            ./tools/package_firmware.sh ${{ matrix.target }}

      # Flashable output, so a first bench test needs esptool and nothing else.
      - name: Collect flashable image
        if: matrix.idf == 'v5.5'
        run: |
          # tools/package_firmware.sh already assembled firmware/ inside the
          # ESP-IDF container; this only reports what came out.
          ls -l firmware/

      - name: Upload firmware
        if: matrix.idf == 'v5.5'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: firmware/
          retention-days: 30
